# Limits bound discovery work and can be adjusted for large releases.
max_depth=3
max_files=4000
max_dirs=128
cache_seconds=30
history_limit=300
save_interval=10
state_dir=~~/state
ui_scale=1
# Local video thumbnails use the running mpv; no FFmpeg executable is needed.
previews=yes
preview_delay=0.12
preview_cache=16
# Optional full path to an alternative encoding-capable mpv executable.
preview_mpv=
