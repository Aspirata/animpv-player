# AniMPV portable configuration. Playback defaults deliberately stay conservative.
osc=no
osd-bar=no
vo=gpu-next
hwdec=auto-safe
gpu-shader-cache-dir=~~/state/shader-cache
idle=yes
force-window=yes
keep-open=yes
save-position-on-quit=no
resume-playback=no
audio-file-auto=no
sub-auto=no
alang=rus,ru,jpn,ja
slang=rus,ru
volume-max=130
title=AniMPV — ${media-title}
screenshot-format=png
screenshot-directory=~~/screenshots
