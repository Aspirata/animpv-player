# All application shortcuts dispatch through the same action interface as buttons.
SPACE script-message-to animpv action pause
LEFT script-message-to animpv action seek-relative -5
RIGHT script-message-to animpv action seek-relative 5
UP script-message-to animpv action volume 5
DOWN script-message-to animpv action volume -5
PGUP script-message-to animpv action prev
PGDWN script-message-to animpv action next
a script-message-to animpv action menu audio
j script-message-to animpv action menu sub
p script-message-to animpv action menu playlist
h script-message-to animpv action menu history
Ctrl+r script-message-to animpv action resume
F5 script-message-to animpv action refresh
f script-message-to animpv action fullscreen
m script-message-to animpv action mute
v script-message-to animpv action sub-visible
TAB script-message-to animpv action show-ui
F1 script-message-to animpv action menu help
MBTN_RIGHT script-message-to animpv action menu main
